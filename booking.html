<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Booking | ChaloChale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-plane-departure text-warning"></i>
                ChaloChale</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation"><span
                    class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
                    <li class="nav-item"><a class="nav-link" href="packages.html">Packages</a></li>
                    <li class="nav-item"><a class="nav-link active" href="booking.html">Booking</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                </ul>
                <a href="signup.html" class="btn btn-warning ms-lg-3 mt-2 mt-lg-0">Signup</a><a href="login.html"
                    class="btn btn-warning ms-lg-3 mt-2 mt-lg-0">Login</a>
            </div>
        </div>
    </nav>
    <header class="page-banner">
        <div class="container">
            <h1>Book Your Trip</h1>
            <p>Share your travel details with us.</p>
        </div>
    </header>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="mb-4">Booking Request Form</h3>
                        <form id="bookingPageForm">
                            <div class="row">
                                <div class="col-md-6 mb-3"><label class="form-label" for="name">Full name</label><input
                                        class="form-control" id="name" required></div>
                                <div class="col-md-6 mb-3"><label class="form-label"
                                        for="bookingEmail">Email</label><input type="email" class="form-control"
                                        id="bookingEmail" required></div>
                            </div>
                            <div class="mb-3"><label class="form-label" for="bookingDestination">Destination /
                                    Package</label><input class="form-control" id="bookingDestination" required></div>
                            <div class="row">
                                <div class="col-md-6 mb-3"><label class="form-label" for="date">Travel
                                        date</label><input type="date" class="form-control" id="date" required></div>
                                <div class="col-md-6 mb-3"><label class="form-label" for="people">Number of
                                        travellers</label><input type="number" min="1" value="1" class="form-control"
                                        id="people" required></div>
                            </div>
                            <div class="mb-3"><label class="form-label" for="message">Additional
                                    requirements</label><textarea class="form-control" id="message" rows="3"></textarea>
                            </div><button class="btn btn-primary" type="submit">Send booking request</button>
                        </form>
                        <div id="bookingPageMessage" class="alert alert-success mt-3 d-none">Thank you! Your demo
                            booking request has been received.</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer py-4 text-center">© 2026 ChaloChale Travel App</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
