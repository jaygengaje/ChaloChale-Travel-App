<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | ChaloChale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-plane-departure text-warning"></i>
                ChaloChale</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation"><span
                    class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
                    <li class="nav-item"><a class="nav-link" href="packages.html">Packages</a></li>
                    <li class="nav-item"><a class="nav-link" href="booking.html">Booking</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                </ul>
                <a href="signup.html" class="btn btn-warning ms-lg-3 mt-2 mt-lg-0">Signup</a><a href="login.html"
                    class="btn btn-warning ms-lg-3 mt-2 mt-lg-0">Login</a>
            </div>
        </div>
    </nav>
    <header class="page-banner">
        <div class="container">
            <h1>Welcome Back</h1>
            <p>Login to your ChaloChale account.</p>
        </div>
    </header>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="mb-4">Login Form</h3>
                        <form id="loginForm">
                            <div class="mb-3"><label for="loginEmail" class="form-label">Email address</label><input
                                    type="email" class="form-control" id="loginEmail" required></div>
                            <div class="mb-3"><label for="loginPassword" class="form-label">Password</label><input
                                    type="password" class="form-control" id="loginPassword" required></div><button
                                class="btn btn-primary w-100" type="submit">Login</button>
                        </form>
                        <div id="loginMessage" class="alert alert-info mt-3 d-none" role="alert">This is a frontend
                            demo. Connect a backend to verify login details.</div>
                        <p class="text-center mt-3 mb-0">New to ChaloChale? <a href="signup.html">Create an account</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer py-4 text-center">© 2026 ChaloChale Travel App</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
