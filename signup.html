<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signup | ChaloChale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-plane-departure text-warning"></i>
                ChaloChale</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation"><span
                    class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
                    <li class="nav-item"><a class="nav-link" href="packages.html">Packages</a></li>
                    <li class="nav-item"><a class="nav-link" href="booking.html">Booking</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                </ul>
                <a href="signup.html" class="btn btn-warning ms-lg-3 mt-2 mt-lg-0">Signup</a><a href="login.html"
                    class="btn btn-warning ms-lg-3 mt-2 mt-lg-0">Login</a>
            </div>
        </div>
    </nav>
    <header class="page-banner">
        <div class="container">
            <h1>Create Your Account</h1>
            <p>Join ChaloChale and start planning your journeys.</p>
        </div>
    </header>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg">
                    <div class="card-body p-4">
                        <h3 class="mb-4">Signup Form</h3>
                        <form id="signupForm">
                            <div class="mb-3"><label for="signupName" class="form-label">Full name</label><input
                                    type="text" class="form-control" id="signupName" required></div>
                            <div class="mb-3"><label for="signupEmail" class="form-label">Email address</label><input
                                    type="email" class="form-control" id="signupEmail" required></div>
                            <div class="mb-3"><label for="signupPassword" class="form-label">Password</label><input
                                    type="password" class="form-control" id="signupPassword" minlength="6" required>
                            </div>
                            <div class="mb-3"><label for="confirmPassword" class="form-label">Confirm
                                    password</label><input type="password" class="form-control" id="confirmPassword"
                                    minlength="6" required></div><button class="btn btn-primary w-100"
                                type="submit">Create Account</button>
                        </form>
                        <div id="signupMessage" class="alert mt-3 d-none" role="alert"></div>
                        <p class="text-center mt-3 mb-0">Already registered? <a href="login.html">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer py-4 text-center">© 2026 ChaloChale Travel App</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
